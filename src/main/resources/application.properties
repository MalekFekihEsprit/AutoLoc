spring.application.name=autoloc-api
# Connexion à la base de donnees
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

server.servlet.context-path=/api
# Palliatif pour les proxies LAZY Hibernate que Jackson ne sait pas serialiser
spring.jackson.serialization.fail-on-empty-beans=false

# Afficher les durees de requête (optionnel)
springdoc.swagger-ui.display-request-duration=true

# ==========================================
# PERSONNALISATION SWAGGER / OPENAPI
# ==========================================
# Chemin d'accès à l'interface Swagger
springdoc.swagger-ui.path=/swagger

# ==========================================
# METADONNEES SWAGGER (SpringDoc 3.x)
# ==========================================
springdoc.openapi.info.title=AutoLoc API
springdoc.openapi.info.description=API REST de gestion de location de vehicules pour le projet ASI.
springdoc.openapi.info.version=1.0.0
springdoc.openapi.info.contact.name=Malek Fekih
springdoc.openapi.info.contact.email=malek.fekih@esprit.tn

# ==========================================
# GROUPES POUR LE MENU DEROULANT SWAGGER
# ==========================================

# Groupe Contrats
springdoc.group-configs[9].group=contrats
springdoc.group-configs[9].display-name=Contrats
springdoc.group-configs[9].paths-to-match=/contrats/**

# Groupe Paiements
springdoc.group-configs[1].group=paiements
springdoc.group-configs[1].display-name=Paiements
springdoc.group-configs[1].paths-to-match=/paiements/**

# Groupe Vehicules
springdoc.group-configs[2].group=vehicules
springdoc.group-configs[2].display-name=Vehicules
springdoc.group-configs[2].paths-to-match=/vehicules/**

# Groupe Clients
springdoc.group-configs[3].group=clients
springdoc.group-configs[3].display-name=Clients
springdoc.group-configs[3].paths-to-match=/clients/**

# Groupe Agences
springdoc.group-configs[4].group=agences
springdoc.group-configs[4].display-name=Agences
springdoc.group-configs[4].paths-to-match=/agences/**

# Groupe Employes
springdoc.group-configs[5].group=employees
springdoc.group-configs[5].display-name=Employes
springdoc.group-configs[5].paths-to-match=/employees/**

# Groupe Equipements
springdoc.group-configs[6].group=equipements
springdoc.group-configs[6].display-name=Equipements
springdoc.group-configs[6].paths-to-match=/equipements/**

# Groupe Reservations
springdoc.group-configs[7].group=reservations
springdoc.group-configs[7].display-name=Reservations
springdoc.group-configs[7].paths-to-match=/reservations/**

# Groupe Maintenances
springdoc.group-configs[8].group=maintenances
springdoc.group-configs[8].display-name=Maintenances
springdoc.group-configs[8].paths-to-match=/maintenances/**

springdoc.group-configs[0].group=all
springdoc.group-configs[0].display-name=Toutes les APIs
springdoc.group-configs[0].paths-to-match=/**
